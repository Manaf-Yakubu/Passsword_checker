<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitplas • Password Forge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-bg" id="matrixBg"></div>
    
    <header class="header">
        <div class="container">
            <div class="terminal-header">
                <div class="terminal-line">
                    <span class="prompt">$</span>
                    <span class="typed-text" id="typedText"></span>
                    <span class="cursor">_</span>
                </div>
            </div>
            <div class="privacy-badge">
                <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Local-only • No network transmission
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="cards-grid">
                <!-- Password Generator Card -->
                <div class="card generator-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <circle cx="12" cy="16" r="1"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            Forge Password
                        </h2>
                    </div>
                    
                    <div class="card-content">
                        <div class="control-group">
                            <label for="lengthSlider" class="control-label">
                                Length: <span id="lengthValue">16</span>
                            </label>
                            <input type="range" id="lengthSlider" min="8" max="64" value="16" class="slider">
                        </div>

                        <div class="toggles-grid">
                            <label class="toggle-item">
                                <input type="checkbox" id="uppercase" checked>
                                <span class="toggle-label">Uppercase (A-Z)</span>
                            </label>
                            <label class="toggle-item">
                                <input type="checkbox" id="lowercase" checked>
                                <span class="toggle-label">Lowercase (a-z)</span>
                            </label>
                            <label class="toggle-item">
                                <input type="checkbox" id="numbers" checked>
                                <span class="toggle-label">Numbers (0-9)</span>
                            </label>
                            <label class="toggle-item">
                                <input type="checkbox" id="symbols" checked>
                                <span class="toggle-label">Symbols (!@#$)</span>
                            </label>
                            <label class="toggle-item">
                                <input type="checkbox" id="avoidAmbiguous">
                                <span class="toggle-label">Avoid ambiguous</span>
                            </label>
                            <label class="toggle-item">
                                <input type="checkbox" id="passphrase">
                                <span class="toggle-label">Passphrase mode</span>
                            </label>
                        </div>

                        <div class="passphrase-controls" id="passphraseControls" style="display: none;">
                            <label for="wordCount" class="control-label">
                                Word Count: <span id="wordCountValue">4</span>
                            </label>
                            <input type="range" id="wordCount" min="3" max="8" value="4" class="slider">
                        </div>

                        <div class="generated-password">
                            <input type="text" id="generatedPassword" readonly placeholder="Click generate to create password" class="password-input">
                            <button id="copyBtn" class="copy-btn" title="Copy to clipboard">
                                <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                </svg>
                            </button>
                        </div>

                        <button id="generateBtn" class="generate-btn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5M7 7l2.5 2.5"/>
                            </svg>
                            Generate Password
                        </button>
                    </div>
                </div>

                <!-- Password Checker Card -->
                <div class="card checker-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M9 12l2 2 4-4"/>
                                <path d="M21 12c-1 0-3-1-3-3s2-3 3-3 3 1 3 3-2 3-3 3"/>
                                <path d="M3 12c1 0 3-1 3-3s-2-3-3-3-3 1-3 3 2 3 3 3"/>
                                <path d="M13 12h1"/>
                            </svg>
                            Audit Password
                        </h2>
                    </div>
                    
                    <div class="card-content">
                        <div class="password-input-group">
                            <input type="password" id="passwordToCheck" placeholder="Enter password to analyze" class="password-input">
                            <button id="toggleVisibility" class="visibility-btn" title="Toggle visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>

                        <div class="strength-meter">
                            <div class="strength-bar">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <div class="strength-label" id="strengthLabel">Enter password to analyze</div>
                        </div>

                        <div class="metrics-grid" id="metricsGrid" style="display: none;">
                            <div class="metric-item">
                                <span class="metric-label">Score</span>
                                <span class="metric-value" id="scoreValue">-</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Entropy</span>
                                <span class="metric-value" id="entropyValue">-</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Crack Time</span>
                                <span class="metric-value" id="crackTimeValue">-</span>
                            </div>
                        </div>

                        <div class="suggestions" id="suggestions" style="display: none;">
                            <h3 class="suggestions-title">Recommendations</h3>
                            <ul class="suggestions-list" id="suggestionsList"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">
                Bitplas Password Forge • Generated locally. Hardened for you. • 
                <a href="#" class="footer-link">Privacy Policy</a>
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
